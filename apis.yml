    url: https://www.maisonette.com/llms.txt
- name: Maisonette Storefront MCP
  description: The lighter read-and-cart Shopify Storefront MCP surface on Maisonette's
    own host — five anonymous tools covering catalog search, product detail, cart read
    and update, and a grounded search over the store's policies and FAQs. Not named in
    llms.txt; discovered by probing the conventional Shopify path.
  humanURL: https://www.maisonette.com/agents.md
