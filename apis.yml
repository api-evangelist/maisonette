apis:
- name: Maisonette UCP Commerce MCP
  description: 'Maisonette''s agent-facing commerce surface: a Universal Commerce Protocol
    (2026-04-08) MCP server exposing thirteen tools across catalog search and lookup,
    cart, checkout and order. tools/list answers 200 with no credentials; tool calls
    require the caller to supply its own published agent-profile URI, and completing
    a checkout requires both an idempotency key and contemporaneous buyer approval.
    Announced by the store''s own llms.txt and /.well-known/ucp.'
  humanURL: https://www.maisonette.com/agents.md
  baseURL: https://www.maisonette.com/api/ucp/mcp
