aid: maisonette
name: Maisonette
description: 'Maisonette is a New York-based online marketplace for babies and children,
  founded in 2017 by Sylvana Ward Durrett and Luisana Mendoza de Roccia, selling clothing,
  toys, furniture and decor for ages 0-12 from a curated network of independent boutiques
  and 800+ brands. It is a marketplace rather than a single seller: each item ships
  directly from its brand and is returned separately. Maisonette publishes no OpenAPI
  and runs no developer program, but its Shopify-hosted storefront exposes a real,
  live, unauthenticated agent surface — a Universal Commerce Protocol MCP endpoint with
  thirteen catalog, cart, checkout and order tools, a five-tool storefront MCP endpoint,
  an llms.txt and agents.md with explicit agent instructions, an agent-discovery sitemap,
  and OAuth 2.0/OIDC and RFC 9728 discovery documents served from its own host.'
