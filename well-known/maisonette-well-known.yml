source: Direct unauthenticated HTTP probes of https://www.maisonette.com/.well-known/*
  and https://api.maisonette.com/.well-known/* on 2026-08-25.
note: 'www.maisonette.com serves four live .well-known documents. The store runs on
  Shopify, so the OAuth/OIDC documents delegate to Shopify''s customer-account authorization
  server (https://shopify.com/authentication/58323238975) while being served from Maisonette''s
  own host and naming Maisonette''s own store as the protected resource. The UCP document
  is the Universal Commerce Protocol merchant profile for this store and names Maisonette
  as merchant in its Google Pay payment-handler config. api.maisonette.com resolves
  but every path returns nginx 503 Service Temporarily Unavailable — a dead legacy
  API host, most likely the retired Spree Store API surface.'
